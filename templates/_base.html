
{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Recenzje książek{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

    {% block extra_css %}
    {% endblock %}
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark site-header">
            <div class="container">

                <a
                    class="navbar-brand fw-bold"
                    href="{% url 'books:book_list' %}"
                >
                    Recenzje książek
                </a>

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Przełącz nawigację"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div
                    class="collapse navbar-collapse"
                    id="mainNavbar"
                >
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'books:book_list' %}"
                            >
                                Książki
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Autorzy
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                Gatunki
                            </a>
                        </li>
                    </ul>

                    <div class="ms-auto d-flex align-items-center gap-3">
                        <form
                            class="d-flex"
                            method="get"
                            action="{% url 'books:book_list' %}"
                        >
                            <input
                                class="form-control"
                                type="search"
                                name="q"
                                placeholder="Szukaj..."
                                aria-label="Szukaj książki"
                            >

                            <button
                                class="btn btn-outline-light ms-2"
                                type="submit"
                            >
                                Szukaj
                            </button>
                        </form>

                        <a
                            class="nav-link"
                            href="#"
                        >
                            Zaloguj
                        </a>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <main class="container py-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer py-4">
        <div class="container">
            <p class="text-center mb-0">
                &copy; {% now "Y" %} Recenzje książek
            </p>
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
