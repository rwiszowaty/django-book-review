name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: book_review
          POSTGRES_USER: book_review
          POSTGRES_PASSWORD: book_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting and lint
        run: flake8 .

      - name: Run migrations
        env:
          DJANGO_DEBUG: "1"
          DATABASE_NAME: book_review
          DATABASE_USER: book_review
          DATABASE_PASSWORD: book_review
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
        run: python manage.py migrate

      - name: Run tests
        env:
          DJANGO_DEBUG: "1"
          DATABASE_NAME: book_review
          DATABASE_USER: book_review
          DATABASE_PASSWORD: book_review
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
        run: python manage.py test